<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Loonie — 3D viewer · Personal Finance From Scratch</title>
  <meta name="theme-color" content="#141414">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 120% at 50% 20%, #1e1e1e 0%, #101010 60%, #070707 100%);
      color: #E8E8E8;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .hud {
      position: fixed; left: 22px; bottom: 20px; z-index: 5;
      font-size: 12px; letter-spacing: 0.04em; line-height: 1.6; color: #9a9a9a;
      pointer-events: none; text-transform: uppercase;
    }
    .hud b { color: #E8E8E8; font-weight: 600; }
    .hud .accent { color: #CD8DBD; }
    .back {
      position: fixed; left: 22px; top: 20px; z-index: 5;
      font-size: 13px; color: #cfcfcf; text-decoration: none;
      border: 1px solid #333; padding: 7px 12px; border-radius: 0;
    }
    .back:hover { border-color: #CD8DBD; color: #fff; }
    #status {
      position: fixed; right: 22px; top: 20px; z-index: 5; max-width: 340px;
      font-size: 12px; line-height: 1.6; color: #cbb8c6;
      background: rgba(40,30,40,0.5); border: 1px solid #4a3a48; padding: 10px 12px;
      display: none;
    }
    #status.err { color: #E0B0B0; background: rgba(60,30,30,0.5); border-color: #6a3a3a; }
    #status code { color: #EDE8DA; }
    #loader {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 4;
      font-size: 13px; letter-spacing: 0.08em; color: #9a9a9a; text-transform: uppercase;
    }
    #loader .bar { margin-top: 10px; width: 180px; height: 2px; background: #2a2a2a; }
    #loader .bar i { display: block; height: 100%; width: 0%; background: #CD8DBD; transition: width .15s ease; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to site</a>
  <div class="hud">
    <b>Canadian Loonie</b> &middot; <span class="accent">drag to orbit</span> &middot; scroll to zoom<br>
    GLB model &middot; Blender animation &middot; PBR studio lighting
  </div>
  <div id="status"></div>
  <div id="loader">Loading model<div class="bar"><i></i></div></div>
  <div id="app"></div>

  <!-- three.js (ESM) + addons, vendored locally so nothing is fetched at runtime -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
    import { GLTFLoader } from 'three/addons/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/meshopt_decoder.module.js';

    /* ============================================================
       Canadian Loonie — real 3D model (GLB, exported from Blender).

       The coin geometry, materials and animation all live inside the
       .glb file. This page only builds the renderer, a studio
       environment and controls, then loads the model and plays any
       embedded animation clip. If the model has no animation we spin
       it slowly on Y ourselves; if the file is missing entirely we
       show a plain placeholder coin plus a notice, so the page never
       renders blank.

       ---- Where the model goes ----
       Put the file at:  ./models/loonie_2003.glb
       (or host it as a GitHub Release asset and set MODEL_URL below.)
       See models/README.md for upload / compression instructions —
       the raw Blender export is usually far too heavy for GitHub
       Pages, so it must be Draco/meshopt-compressed or Release-hosted.
       Both Draco- and meshopt-compressed GLBs are supported here.
       ============================================================ */

    // The model is served as a GitHub *Release asset* (kept out of the repo so
    // the heavy .glb doesn't bloat Pages). It loads once you attach the file to
    // a release tagged "coin-v1" — see models/README.md for the 3-step upload.
    // (Release downloads are sent with CORS headers, so the browser can fetch
    //  them straight from the Pages origin.)
    const MODEL_URL = 'https://github.com/Kali2007thecodemaster/finance/releases/download/coin-v1/loonie_2003.glb';
    // If you'd rather commit a *compressed* copy instead, drop it at
    // ./models/loonie_2003.glb and set MODEL_URL back to that path.

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');
    const loaderEl = document.getElementById('loader');
    const loaderBar = loaderEl.querySelector('.bar i');

    /* ---------- renderer ---------- */
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    app.appendChild(renderer.domElement);

    /* ---------- scene / camera ---------- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.15, 4.2);

    /* ---------- environment (procedural studio, no HDR file needed) ---------- */
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    /* ---------- lighting (also lights the fallback coin) ---------- */
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-3, 4, 5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
    fill.position.set(4, -1.5, 3);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffe6bd, 1.2);
    rim.position.set(1.5, 2, -4);
    scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.15));

    /* ---------- controls ---------- */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.2;
    controls.maxDistance = 8;
    controls.target.set(0, 0, 0);

    /* ---------- model root + animation ---------- */
    const root = new THREE.Group();
    scene.add(root);
    let mixer = null;          // AnimationMixer if the GLB has clips
    let spin = true;           // spin ourselves only when there's no clip
    let model = null;

    /* Fit any loaded object to a consistent on-screen size and centre it. */
    function frameObject(obj, targetSize = 2.4) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const s = targetSize / maxDim;
      obj.scale.setScalar(s);
      // recompute centre after scaling and lift to origin
      obj.position.sub(center.multiplyScalar(s));
    }

    /* ---------- GLTF / GLB loader (Draco + meshopt ready) ---------- */
    const draco = new DRACOLoader();
    draco.setDecoderPath('./vendor/three/draco/');   // local decoder, no CDN
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(draco);
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        loaderEl.style.display = 'none';
        model = gltf.scene || gltf.scenes[0];

        // make sure every texture is treated as colour-managed sRGB
        model.traverse((o) => {
          if (o.isMesh && o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of mats) {
              if (m.map) { m.map.colorSpace = THREE.SRGBColorSpace; if ('encoding' in m.map) m.map.encoding = THREE.sRGBEncoding; }
              m.envMapIntensity = 1.2;
              m.needsUpdate = true;
            }
          }
        });

        frameObject(model);
        root.add(model);

        // play the embedded Blender animation, if any
        if (gltf.animations && gltf.animations.length) {
          spin = false;
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        } else {
          setStatus('Model loaded — no embedded animation clip, so it is spinning on its Y axis. '
            + 'Add an action + <code>NLA track</code> in Blender and re-export to drive it.', false);
        }
      },
      (evt) => {
        if (evt && evt.total) {
          const pct = Math.min(100, Math.round((evt.loaded / evt.total) * 100));
          loaderBar.style.width = pct + '%';
        }
      },
      () => {
        // model missing / failed → placeholder coin + notice
        loaderEl.style.display = 'none';
        buildPlaceholder();
        setStatus('Model not loaded yet. Showing a plain placeholder coin. '
          + 'Attach <code>loonie_2003.glb</code> to a GitHub Release tagged '
          + '<code>coin-v1</code> (see <code>models/README.md</code>) and it will appear here.', true);
      }
    );

    /* ---------- placeholder (only if the GLB is absent) ---------- */
    function buildPlaceholder() {
      const geo = new THREE.CylinderGeometry(1.2, 1.2, 0.15, 11, 1, false);
      geo.rotateX(Math.PI / 2);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xC8A22E, metalness: 1.0, roughness: 0.34, envMapIntensity: 1.5, flatShading: true
      });
      model = new THREE.Mesh(geo, mat);
      root.add(model);
      spin = true;
    }

    function setStatus(html, isErr) {
      statusEl.className = isErr ? 'err' : '';
      statusEl.style.display = 'block';
      statusEl.innerHTML = html;
    }

    /* ---------- resize ---------- */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------- loop ---------- */
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clock = new THREE.Clock();
    function tick() {
      requestAnimationFrame(tick);
      const dt = clock.getDelta();
      if (mixer && !reduce) mixer.update(dt);
      if (spin && !reduce && model) root.rotation.y += 0.006;
      controls.update();
      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
