<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Loonie — 3D viewer · Personal Finance From Scratch</title>
  <meta name="theme-color" content="#141414">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 120% at 50% 20%, #1e1e1e 0%, #101010 60%, #070707 100%);
      color: #E8E8E8;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .hud {
      position: fixed; left: 22px; bottom: 20px; z-index: 5;
      font-size: 12px; letter-spacing: 0.04em; line-height: 1.6; color: #9a9a9a;
      pointer-events: none; text-transform: uppercase;
    }
    .hud b { color: #E8E8E8; font-weight: 600; }
    .hud .accent { color: #CD8DBD; }
    .back {
      position: fixed; left: 22px; top: 20px; z-index: 5;
      font-size: 13px; color: #cfcfcf; text-decoration: none;
      border: 1px solid #333; padding: 7px 12px; border-radius: 0;
    }
    .back:hover { border-color: #CD8DBD; color: #fff; }
    #warn {
      position: fixed; right: 22px; top: 20px; z-index: 5; max-width: 320px;
      font-size: 12px; line-height: 1.6; color: #E0B0B0;
      background: rgba(60,30,30,0.5); border: 1px solid #6a3a3a; padding: 10px 12px;
      display: none;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to site</a>
  <div class="hud">
    <b>Canadian Loonie</b> &middot; <span class="accent">drag to orbit</span> &middot; scroll to zoom<br>
    11-sided &middot; PBR gold &middot; image-textured obverse / reverse
  </div>
  <div id="warn"></div>
  <div id="app"></div>

  <!-- three.js (ESM) + addons, vendored locally so nothing is fetched at runtime -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

    /* ============================================================
       Canadian Loonie — image-textured, per spec.
       The coin's details are NOT drawn in code: the loon, the
       Queen and the lettering all come from the supplied image
       maps (colour / normal / roughness) for each face. This
       file only builds the geometry, materials, environment and
       controls, and loads those images.

       Drop six files in ./textures/loonie/ :
         obverse_color.jpg      reverse_color.jpg
         obverse_normal.jpg     reverse_normal.jpg
         obverse_roughness.jpg  reverse_roughness.jpg
       Each should be a SQUARE crop with the coin centred and
       filling the frame (the cap UVs sample the inscribed disc,
       so square corners are never shown).
       ============================================================ */

    const TEX_DIR = './textures/loonie/';
    const app = document.getElementById('app');
    const warn = document.getElementById('warn');

    /* ---------- renderer ---------- */
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    app.appendChild(renderer.domElement);

    /* ---------- scene / camera ---------- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.15, 4.2);

    /* ---------- environment (procedural studio, no HDR file needed) ---------- */
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    /* ---------- lighting to catch the normal maps ---------- */
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-3, 4, 5);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
    fill.position.set(4, -1.5, 3);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffe6bd, 1.2);
    rim.position.set(1.5, 2, -4);
    scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.15));

    /* ---------- textures ---------- */
    const loader = new THREE.TextureLoader();
    const missing = [];

    /*  CylinderGeometry cap UVs are rotated a quarter turn relative to an
        upright image, and the bottom cap is additionally mirrored. These
        transforms put a normally-oriented photo the right way up on each
        face. Tweak `rot` / `flip` here if a face lands sideways.        */
    function faceTexture(name, { srgb = false, rot = -Math.PI / 2, flipX = false } = {}) {
      const url = TEX_DIR + name;
      const tex = loader.load(url, undefined, undefined, () => { missing.push(name); showWarn(); });
      tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      // r149 fallbacks for the encoding property name
      if (srgb && 'encoding' in tex) tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.center.set(0.5, 0.5);
      tex.rotation = rot;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      if (flipX) tex.repeat.x = -1;
      return tex;
    }

    function faceMaterial(side, flipX) {
      return new THREE.MeshStandardMaterial({
        map:          faceTexture(side + '_color.jpg',     { srgb: true, flipX }),
        normalMap:    faceTexture(side + '_normal.jpg',    { flipX }),
        roughnessMap: faceTexture(side + '_roughness.jpg', { flipX }),
        normalScale:  new THREE.Vector2(1.0, 1.0),
        color:        0xffffff,
        metalness:    1.0,
        roughness:    1.0,           /* modulated by the roughness map */
        envMapIntensity: 1.35
      });
    }

    /*  the reeded-looking edge is just polished aureate gold — the loonie's
        edge is plain, and a solid metal reads better than a stretched map  */
    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0xC8A22E, metalness: 1.0, roughness: 0.34, envMapIntensity: 1.5, flatShading: true
    });

    /* the obverse maps to the top cap (+Z after the rotate), reverse to the
       bottom cap (-Z). The bottom cap's UV mirror is corrected with flipX. */
    const materials = [ edgeMaterial, faceMaterial('obverse', false), faceMaterial('reverse', true) ];

    /* ---------- geometry: 11-sided coin ---------- */
    const RADIUS = 1.2, THICKNESS = 0.15, SIDES = 11;
    const geo = new THREE.CylinderGeometry(RADIUS, RADIUS, THICKNESS, SIDES, 1, false);
    geo.rotateX(Math.PI / 2);        /* caps face the camera (±Z) */

    const coin = new THREE.Mesh(geo, materials);
    scene.add(coin);

    /* ---------- controls ---------- */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.2;
    controls.maxDistance = 8;
    controls.autoRotate = false;     /* we spin the coin itself, below */

    /* ---------- resize ---------- */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------- loop: slow, continuous Y-axis rotation ---------- */
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function tick() {
      requestAnimationFrame(tick);
      if (!reduce) coin.rotation.y += 0.006;
      controls.update();
      renderer.render(scene, camera);
    }
    tick();

    /* ---------- missing-texture notice (so the page is honest) ---------- */
    let warned = false;
    function showWarn() {
      if (warned) return; warned = true;
      warn.style.display = 'block';
      warn.innerHTML = 'Texture files not found in <b>textures/loonie/</b>. The coin is showing plain gold until the six image maps (obverse/reverse &times; colour/normal/roughness) are added.';
    }
  </script>
</body>
</html>
